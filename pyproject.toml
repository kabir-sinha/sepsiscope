[project]
name = "sepsiscope"
version = "0.1.0"
description = "Explainable, alarm-budgeted sepsis early-warning research prototype (PhysioNet/CinC 2019)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "SepsiScope contributors", email = "222482936+kabir-sinha@users.noreply.github.com" }
]
requires-python = ">=3.13.18,<3.14"
dependencies = [
    "dcurves==1.1.7",
    "defusedxml==0.7.1",
    "duckdb==1.5.6",
    "fastapi==0.162.6",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "mlflow==3.18.0",
    "numpy==2.5.3",
    "optuna==5.0.0",
    "pandas==3.0.6",
    "pandera==0.34.1",
    "pyarrow==25.0.1",
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "shap==0.53.0",
    "typer==0.29.0",
    "uvicorn==0.54.0",
]

[project.scripts]
sepsiscope = "sepsiscope.cli:app"

[project.optional-dependencies]
xgb = [
    "xgboost==3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Reuse the Homebrew Python 3.13 already on the local machine instead of downloading a
# uv-managed copy. CI (no system 3.13) can still fall back to a managed one.
python-preference = "system"
# Same uv minor locally and in CI (setup-uv reads this).
required-version = ">=0.13.4,<0.14"
# Security floors (ADR 0017, amended 2026-11-13): never resolve below the patched releases.
# Constraints only restrict versions; they never add packages to the environment.
constraint-dependencies = [
    "certifi>=2026.10.23",
    "filelock>=4.2.10",
    "gitpython>=3.2.1",
    "mlflow>=3.18.0",
    "mlflow-skinny>=3.18.0",
    "mlflow-tracing>=3.18.0",
    "nbconvert>=7.17.2",
    "pillow>=13.0.0",
    "pyasn1>=0.6.5",
    "soupsieve>=4.1",
    "tornado>=6.6.1",
    "virtualenv>=21.15.6",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.5",
    "jupyterlab==4.6.4",
    "mypy==2.4.0",
    "nbstripout==0.9.1",
    "pandas-stubs==3.0.5.260914",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "types-defusedxml==0.7.0.20260504",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["web", "third_party"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "NPY", "PD"]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603"]   # subprocess with sys.executable in tests
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*", "sklearn", "sklearn.*", "mlflow", "mlflow.*", "pyarrow", "pyarrow.*", "dcurves", "dcurves.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["data: needs the real PhysioNet dataset on disk (skipped when absent, never in CI)"]

[tool.coverage.run]
source = ["sepsiscope"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
