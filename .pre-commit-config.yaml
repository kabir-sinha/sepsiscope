# pre-commit hooks. Install once per clone:  uv run pre-commit install
# ruff / mypy run through `uv run` as local hooks so they use the exact versions
# locked in uv.lock (no second copy pinned here that could drift).
# `language: unsupported` is the pre-commit >= 4.4 name for the old `system`.
minimum_pre_commit_version: "4.4.0"
# `pre-commit install` sets up all three git hooks; existing hooks stay commit-time only.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^third_party/  # vendored files stay byte-identical
      - id: trailing-whitespace
        exclude: ^third_party/  # vendored files stay byte-identical
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: privacy-guard
        name: privacy guard (paths, emails, account wording, denylist, data, notebooks, >1 MB)
        entry: uv run --frozen python scripts/privacy_guard.py
        language: unsupported
        types: [file]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict, src/)
        entry: uv run --frozen mypy src
        language: unsupported
        types: [python]
        pass_filenames: false
      - id: nbstripout
        name: nbstripout
        entry: uv run --frozen nbstripout
        language: unsupported
        types: [jupyter]
      - id: commit-msg-check
        name: commit message (no AI trailers, nothing personal)
        entry: uv run --frozen python -m sepsiscope.audit.hooks commit-msg
        language: unsupported
        stages: [commit-msg]
      - id: pre-push-check
        name: outgoing commits (+0000 offsets, allowed identities, messages)
        entry: uv run --frozen python -m sepsiscope.audit.hooks pre-push
        language: unsupported
        stages: [pre-push]
        pass_filenames: false
        always_run: true
