name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  DO_NOT_TRACK: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  python:
    runs-on: ubuntu-24.04  # pinned on purpose; upgrade deliberately (see docs/internal/ops.md)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history: the commit check below needs the pushed range
      # No `python-version` input on purpose: uv reads .python-version itself,
      # so that file is the single source of truth.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Toolchain versions (security minimums, ADR 0017)
        run: |
          set -euo pipefail
          floor() {  # fail if version $1 is below minimum $2
            [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ] \
              || { echo "::error::$3 $1 is below the security minimum $2"; exit 1; }
          }
          uv_v="$(uv --version | awk '{print $2}')"
          py_v="$(uv run --frozen python -c 'import platform; print(platform.python_version())')"
          echo "uv ${uv_v}"
          echo "python ${py_v}"
          floor "$uv_v" 0.13.4 uv
          floor "$py_v" 3.13.18 Python
      - name: Privacy guard (all tracked files)
        # Also catches anything committed with `git commit --no-verify`. Generic patterns
        # only: the local denylist is gitignored and never exists in CI.
        run: git ls-files -z | xargs -0 uv run --frozen python scripts/privacy_guard.py
      - name: Commit check (+0000 offsets, allowed identities, messages)
        # Push: before..sha. Pull request: base..head. Same rules as the pre-push hook.
        env:
          FROM_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: uv run --frozen python -m sepsiscope.audit.hooks commits --from "$FROM_SHA" --to "$TO_SHA"
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy src
      - name: Pytest
        run: uv run --frozen pytest --cov --cov-report=term

  gitleaks:
    runs-on: ubuntu-24.04  # pinned on purpose; upgrade deliberately (see docs/internal/ops.md)
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Official release assets, cross-checked on 2026-11-13 against GitHub's asset digests
      # and the release's own checksums file. Download to a file, verify, then extract;
      # no third-party action and nothing is piped into a shell.
      GITLEAKS_TARBALL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      GITLEAKS_CHECKSUMS_SHA256: "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # scan every commit
      - name: Download and verify gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tarball" "$base/$tarball"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$sums" "$base/$sums"
          echo "${GITLEAKS_CHECKSUMS_SHA256}  ${sums}" | sha256sum -c -
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          echo "${GITLEAKS_TARBALL_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Scan the full history (secrets redacted)
        run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose --log-opts="--all" .'

  web:
    runs-on: ubuntu-24.04  # pinned on purpose; upgrade deliberately (see docs/internal/ops.md)
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Toolchain versions (security minimums, ADR 0017)
        run: |
          set -euo pipefail
          floor() {  # fail if version $1 is below minimum $2
            [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ] \
              || { echo "::error::$3 $1 is below the security minimum $2"; exit 1; }
          }
          node_v="$(node --version | sed 's/^v//')"
          echo "node ${node_v}"
          echo "npm $(npm --version)"
          floor "$node_v" 26.13.1 Node
      - run: npm ci
      - run: npm run lint
      - run: npm run build
