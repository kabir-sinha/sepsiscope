version: 2
updates:
  # Python (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # One PR per month for all minor and patch updates (ADR 0028); majors and
      # security updates still come as their own PRs.
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned for byte-identical reproducibility (ADR 0027): majors are upgraded deliberately.
      - dependency-name: "pyarrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-major"]

  # Frontend (web/package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # One PR per month for all minor and patch updates (ADR 0028); majors and
      # security updates still come as their own PRs.
      web-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Decision (ADR 0010): stay on TypeScript ~6.0, the Vite template's pin.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must match the Node runtime in web/.nvmrc; it is upgraded
      # deliberately, together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows (keeps the SHA pins and version comments current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # One PR per month for all minor and patch updates (ADR 0028); majors and
      # security updates still come as their own PRs.
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
